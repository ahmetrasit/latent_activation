<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff1e5">
  <meta name="description" content="v12 cross-run Türkçe yayın bulguları için statik GitHub Pages okuyucusu.">
  <title>v12 Cross-Run Turkish Reader</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fff1e5;
      --paper-deep: #f2dfce;
      --ink: #262a33;
      --muted: #66605c;
      --rule: #d8c3ad;
      --rule-strong: #b9a48f;
      --accent: #990f3d;
      --accent-dark: #7d0a31;
      --teal: #0d7680;
      --gold: #b3862c;
      --green: #2f6f4e;
      --white: #fffaf3;
      --shadow: 0 18px 42px rgba(38, 42, 51, .12);
      --serif: Georgia, "Times New Roman", Times, serif;
      --sans: Metric, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.45;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .masthead {
      border-bottom: 1px solid var(--ink);
      background: var(--paper);
    }

    .masthead-inner {
      width: min(1320px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 16px;
    }

    .kicker {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: .74rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(2.1rem, 7vw, 5.9rem);
      font-weight: 700;
      line-height: .9;
      letter-spacing: -.03em;
    }

    .dek {
      max-width: 780px;
      margin: 14px 0 0;
      color: var(--muted);
      font-family: var(--serif);
      font-size: clamp(1.05rem, 2.2vw, 1.32rem);
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .stat {
      display: inline-flex;
      gap: 8px;
      align-items: baseline;
      min-height: 32px;
      padding: 5px 10px;
      border: 1px solid var(--rule);
      background: rgba(255, 250, 243, .5);
      font-size: .88rem;
      font-weight: 700;
    }

    .stat span {
      color: var(--muted);
      font-weight: 600;
    }

    .app {
      width: min(1320px, calc(100% - 28px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 28px;
      padding: 24px 0 42px;
    }

    .rail {
      position: sticky;
      top: 0;
      align-self: start;
      max-height: 100vh;
      padding: 0 0 24px;
      overflow: auto;
    }

    .toolbar {
      display: grid;
      gap: 10px;
      padding-bottom: 14px;
      background: var(--paper);
    }

    .search {
      width: 100%;
      height: 42px;
      border: 1px solid var(--rule-strong);
      border-radius: 0;
      background: var(--white);
      color: var(--ink);
      padding: 0 11px;
      outline: none;
    }

    .search:focus {
      border-color: var(--accent);
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .select-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    select {
      min-width: 0;
      height: 38px;
      border: 1px solid var(--rule-strong);
      border-radius: 0;
      background: var(--white);
      color: var(--ink);
      padding: 0 8px;
    }

    .surah-list {
      display: grid;
      border-top: 1px solid var(--rule-strong);
    }

    .surah-button {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      border: 0;
      border-bottom: 1px solid var(--rule);
      background: transparent;
      color: var(--ink);
      padding: 7px 4px;
      text-align: left;
    }

    .surah-button:hover,
    .surah-button.active {
      background: var(--paper-deep);
    }

    .surah-no {
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      font-weight: 800;
    }

    .surah-name {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-family: var(--serif);
      font-weight: 700;
    }

    .surah-count {
      color: var(--muted);
      font-size: .78rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .reader {
      min-width: 0;
    }

    .reader-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .surah-title {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(2rem, 4.6vw, 4rem);
      line-height: .96;
      letter-spacing: -.02em;
    }

    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: .92rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .link-button,
    .nav-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      border: 1px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      padding: 0 10px;
      text-decoration: none;
      font-size: .86rem;
      font-weight: 800;
    }

    .link-button:hover,
    .nav-button:hover:not(:disabled) {
      background: var(--ink);
      color: var(--paper);
    }

    .nav-button:disabled {
      cursor: default;
      opacity: .42;
    }

    .ayah-nav {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin: 18px 0;
      padding: 10px;
      border: 1px solid var(--rule);
      background: rgba(255, 250, 243, .58);
    }

    .range-wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .position {
      color: var(--muted);
      font-size: .86rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .ayah {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 24px;
      min-height: 500px;
      border-top: 1px solid var(--rule-strong);
      border-bottom: 1px solid var(--rule-strong);
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .ayah-side {
      border-right: 1px solid var(--rule);
      padding: 22px 14px;
      background: var(--paper-deep);
    }

    .ayah-ref {
      font-family: var(--serif);
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
    }

    .ayah-kind {
      margin-top: 8px;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .ayah-main {
      min-width: 0;
      padding: 24px 24px 28px 0;
    }

    .baseline-label,
    .findings-label {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: .74rem;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .baseline {
      margin: 0;
      max-width: 900px;
      font-family: var(--serif);
      font-size: clamp(1.45rem, 3.1vw, 2.35rem);
      line-height: 1.18;
    }

    .tokens {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 16px;
    }

    .token {
      border: 1px solid var(--rule);
      background: var(--paper);
      padding: 3px 6px;
      color: var(--muted);
      font-size: .78rem;
    }

    .findings {
      margin-top: 28px;
      display: grid;
      gap: 12px;
    }

    .finding {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 14px;
      border-top: 1px solid var(--rule);
      padding-top: 13px;
    }

    .grade {
      align-self: start;
      display: inline-flex;
      justify-content: center;
      min-width: 76px;
      border: 1px solid var(--ink);
      padding: 4px 7px;
      font-size: .75rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .grade.strong { background: var(--ink); color: var(--paper); }
    .grade.weak { border-color: var(--gold); color: #6f5215; background: #f5e6be; }
    .grade.reject { border-color: var(--accent); color: var(--accent); background: #f8d6de; }

    .finding-text {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.12rem;
      line-height: 1.42;
    }

    .anchors {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
    }

    .anchor {
      display: inline-flex;
      gap: 5px;
      border: 1px solid var(--rule);
      background: var(--paper);
      padding: 3px 6px;
      color: var(--muted);
      font-size: .75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .empty {
      border-top: 1px solid var(--rule);
      padding-top: 13px;
      color: var(--muted);
      font-family: var(--serif);
      font-size: 1.05rem;
    }

    .footer-note {
      margin-top: 18px;
      color: var(--muted);
      font-size: .86rem;
    }

    .error {
      border: 2px solid var(--accent);
      background: #f8d6de;
      padding: 16px;
      font-weight: 800;
    }

    @media (max-width: 860px) {
      .app {
        display: block;
      }

      .rail {
        position: static;
        max-height: none;
        margin-bottom: 18px;
      }

      .surah-list {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1px;
        border: 1px solid var(--rule);
        background: var(--rule);
      }

      .surah-button {
        min-height: 44px;
        border: 0;
        background: var(--paper);
      }

      .reader-top {
        grid-template-columns: 1fr;
      }

      .links {
        justify-content: flex-start;
      }

      .ayah {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .ayah-side {
        border-right: 0;
        border-bottom: 1px solid var(--rule);
        padding: 16px;
      }

      .ayah-main {
        padding: 18px 16px 24px;
      }

      .finding {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <p class="kicker">v12 cross-run</p>
      <h1>Turkish publication reader</h1>
      <p class="dek">Ayah-level baseline text and contextual-root findings, rendered from the committed final JSON corpus.</p>
      <div class="stats" id="stats">
        <span class="stat"><b>Loading</b><span>corpus</span></span>
      </div>
    </div>
  </header>

  <main class="app">
    <aside class="rail">
      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="Surah, ayah, text, root" autocomplete="off">
        <div class="select-row">
          <select id="gradeFilter" aria-label="Grade filter">
            <option value="all">All grades</option>
            <option value="strong">Strong</option>
            <option value="weak">Weak</option>
            <option value="reject">Reject</option>
            <option value="empty">No findings</option>
          </select>
          <select id="surahSelect" aria-label="Surah select"></select>
        </div>
      </div>
      <nav class="surah-list" id="surahList" aria-label="Surah list"></nav>
    </aside>

    <section class="reader" id="reader" aria-live="polite">
      <div class="error">Loading publication corpus...</div>
    </section>
  </main>

  <script>
    const SURAHS = [
      "Fatiha","Bakara","Al-i İmran","Nisa","Maide","Enam","Araf","Enfal","Tevbe","Yunus","Hud","Yusuf","Rad","İbrahim","Hicr","Nahl","İsra","Kehf","Meryem","Taha","Enbiya","Hac","Muminun","Nur","Furkan","Şuara","Neml","Kasas","Ankebut","Rum","Lokman","Secde","Ahzab","Sebe","Fatır","Yasin","Saffat","Sad","Zumer","Mumin","Fussilet","Şura","Zuhruf","Duhan","Casiye","Ahkaf","Muhammed","Fetih","Hucurat","Kaf","Zariyat","Tur","Necm","Kamer","Rahman","Vakia","Hadid","Mucadele","Haşr","Mumtehine","Saff","Cuma","Munafikun","Tegabun","Talak","Tahrim","Mulk","Kalem","Hakka","Mearic","Nuh","Cin","Muzzemmil","Muddessir","Kıyamet","İnsan","Murselat","Nebe","Naziat","Abese","Tekvir","İnfitar","Mutaffifin","İnşikak","Buruc","Tarık","Ala","Gaşiye","Fecr","Beled","Şems","Leyl","Duha","İnşirah","Tin","Alak","Kadir","Beyyine","Zilzal","Adiyat","Karia","Tekasur","Asr","Humeze","Fil","Kureyş","Maun","Kevser","Kafirun","Nasr","Tebbet","İhlas","Felak","Nas"
    ].map((name, i) => ({ n: i + 1, name }));

    const state = {
      corpus: new Map(),
      currentSurah: 1,
      currentAyah: 0,
      query: "",
      grade: "all"
    };

    const $ = (id) => document.getElementById(id);
    const outputPath = (n) => `_status/v12_cross_run/output/tr/${n}_ayah_findings_publication.json`;
    const workspacePath = (n, file) => `_status/v12_cross_run/s${String(n).padStart(3, "0")}/${file}`;

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function gradeLabel(grade) {
      return grade === "strong" ? "Strong" : grade === "weak" ? "Weak" : "Reject";
    }

    function flattenSurah(data) {
      return data.ayat.map((ayah) => {
        const findingText = ayah.findings.map((f) => f.text).join(" ");
        const anchors = ayah.findings
          .flatMap((f) => f.anchors)
          .map((a) => `${a[0]} ${a[1]} ${a[2].join(" ")}`)
          .join(" ");
        return `${ayah.ayah_ref} ${ayah.baseline.text} ${findingText} ${anchors}`.toLocaleLowerCase("tr");
      });
    }

    async function loadCorpus() {
      const responses = await Promise.all(SURAHS.map(async ({ n }) => {
        const response = await fetch(outputPath(n), { cache: "no-store" });
        if (!response.ok) throw new Error(`S${String(n).padStart(3, "0")} could not load`);
        const data = await response.json();
        data._search = flattenSurah(data);
        state.corpus.set(n, data);
        return data;
      }));
      return responses;
    }

    function getVisibleAyahIndexes(data) {
      const q = state.query.trim().toLocaleLowerCase("tr");
      return data.ayat
        .map((ayah, index) => ({ ayah, index }))
        .filter(({ ayah, index }) => {
          if (state.grade === "empty" && ayah.findings.length !== 0) return false;
          if (state.grade !== "all" && state.grade !== "empty" && !ayah.findings.some((f) => f.grade === state.grade)) return false;
          if (q && !data._search[index].includes(q)) return false;
          return true;
        })
        .map(({ index }) => index);
    }

    function renderStats() {
      const loaded = state.corpus.size;
      let ayat = 0, findings = 0, strong = 0, weak = 0, reject = 0;
      for (const data of state.corpus.values()) {
        ayat += data.ayat.length;
        for (const ayah of data.ayat) {
          findings += ayah.findings.length;
          for (const finding of ayah.findings) {
            if (finding.grade === "strong") strong += 1;
            if (finding.grade === "weak") weak += 1;
            if (finding.grade === "reject") reject += 1;
          }
        }
      }
      $("stats").innerHTML = [
        ["Surahs", `${loaded}/114`],
        ["Ayah rows", ayat.toLocaleString("en-US")],
        ["Findings", findings.toLocaleString("en-US")],
        ["Strong", strong.toLocaleString("en-US")],
        ["Weak", weak.toLocaleString("en-US")],
        ["Reject", reject.toLocaleString("en-US")]
      ].map(([label, value]) => `<span class="stat"><b>${value}</b><span>${label}</span></span>`).join("");
    }

    function renderSurahControls() {
      $("surahSelect").innerHTML = SURAHS
        .map(({ n, name }) => `<option value="${n}">${n}. ${escapeHtml(name)}</option>`)
        .join("");

      $("surahList").innerHTML = SURAHS.map(({ n, name }) => {
        const data = state.corpus.get(n);
        const findings = data ? data.ayat.reduce((sum, ayah) => sum + ayah.findings.length, 0) : 0;
        return `<button class="surah-button${n === state.currentSurah ? " active" : ""}" data-surah="${n}">
          <span class="surah-no">${String(n).padStart(3, "0")}</span>
          <span class="surah-name">${escapeHtml(name)}</span>
          <span class="surah-count">${findings}</span>
        </button>`;
      }).join("");

      $("surahSelect").value = String(state.currentSurah);
    }

    function renderReader() {
      const data = state.corpus.get(state.currentSurah);
      if (!data) return;

      const surah = SURAHS[state.currentSurah - 1];
      const visible = getVisibleAyahIndexes(data);
      if (!visible.includes(state.currentAyah)) state.currentAyah = visible[0] ?? 0;
      const visiblePosition = Math.max(0, visible.indexOf(state.currentAyah));
      const ayah = data.ayat[state.currentAyah];
      const previous = visible[visiblePosition - 1];
      const next = visible[visiblePosition + 1];
      const totalFindings = data.ayat.reduce((sum, item) => sum + item.findings.length, 0);

      $("reader").innerHTML = `
        <div class="reader-top">
          <div>
            <h2 class="surah-title">${state.currentSurah}. ${escapeHtml(surah.name)}</h2>
            <div class="meta">${data.ayat.length} ayah row · ${totalFindings} findings · ${visible.length} visible</div>
          </div>
          <div class="links">
            <a class="link-button" href="${outputPath(state.currentSurah)}">final JSON</a>
            <a class="link-button" href="${workspacePath(state.currentSurah, "publication_manifest.v3.json")}">manifest</a>
            <a class="link-button" href="${workspacePath(state.currentSurah, "publication.v3.draft.json")}">draft</a>
            <a class="link-button" href="${workspacePath(state.currentSurah, "self_audit.v3.json")}">audit</a>
          </div>
        </div>

        <div class="ayah-nav">
          <button class="nav-button" id="prevAyah" ${previous === undefined ? "disabled" : ""}>Previous</button>
          <div class="range-wrap">
            <input id="ayahRange" type="range" min="0" max="${Math.max(0, visible.length - 1)}" value="${visiblePosition}" ${visible.length ? "" : "disabled"}>
            <span class="position">${visible.length ? visiblePosition + 1 : 0}/${visible.length}</span>
          </div>
          <button class="nav-button" id="nextAyah" ${next === undefined ? "disabled" : ""}>Next</button>
        </div>

        ${visible.length ? renderAyah(ayah) : `<div class="error">No ayah matches the current filters.</div>`}

        <div class="footer-note">Source: ${escapeHtml(outputPath(state.currentSurah))}</div>
      `;

      $("prevAyah")?.addEventListener("click", () => {
        if (previous !== undefined) {
          state.currentAyah = previous;
          renderReader();
        }
      });
      $("nextAyah")?.addEventListener("click", () => {
        if (next !== undefined) {
          state.currentAyah = next;
          renderReader();
        }
      });
      $("ayahRange")?.addEventListener("input", (event) => {
        state.currentAyah = visible[Number(event.target.value)];
        renderReader();
      });
    }

    function renderAyah(ayah) {
      const isSynthetic = ayah.ayah_ref.endsWith(":0");
      const tokens = ayah.baseline.target_tokens || [];
      return `
        <article class="ayah">
          <aside class="ayah-side">
            <div class="ayah-ref">${escapeHtml(ayah.ayah_ref)}</div>
            <div class="ayah-kind">${isSynthetic ? "Basmalah" : "Ayah"}</div>
          </aside>
          <div class="ayah-main">
            <p class="baseline-label">Baseline</p>
            <p class="baseline">${escapeHtml(ayah.baseline.text)}</p>
            <div class="tokens">
              ${tokens.map(([surface, refs]) => `<span class="token">${escapeHtml(surface)} · ${escapeHtml(refs.join(","))}</span>`).join("")}
            </div>

            <div class="findings">
              <p class="findings-label">Findings</p>
              ${ayah.findings.length ? ayah.findings.map(renderFinding).join("") : `<div class="empty">No contextual findings for this ayah.</div>`}
            </div>
          </div>
        </article>
      `;
    }

    function renderFinding(finding) {
      return `
        <section class="finding">
          <span class="grade ${escapeHtml(finding.grade)}">${gradeLabel(finding.grade)}</span>
          <div>
            <p class="finding-text">${escapeHtml(finding.text)}</p>
            <div class="anchors">
              ${finding.anchors.map((anchor) => `<span class="anchor"><b>${escapeHtml(anchor[0])}</b><span>${escapeHtml(anchor[1])}</span><span>${escapeHtml(anchor[2].join("+"))}</span></span>`).join("")}
            </div>
          </div>
        </section>
      `;
    }

    function bindEvents() {
      $("search").addEventListener("input", (event) => {
        state.query = event.target.value;
        renderReader();
      });
      $("gradeFilter").addEventListener("change", (event) => {
        state.grade = event.target.value;
        renderReader();
      });
      $("surahSelect").addEventListener("change", (event) => {
        setSurah(Number(event.target.value));
      });
      $("surahList").addEventListener("click", (event) => {
        const button = event.target.closest("[data-surah]");
        if (button) setSurah(Number(button.dataset.surah));
      });
      window.addEventListener("keydown", (event) => {
        if (event.target.matches("input, select, textarea")) return;
        const data = state.corpus.get(state.currentSurah);
        if (!data) return;
        const visible = getVisibleAyahIndexes(data);
        const pos = visible.indexOf(state.currentAyah);
        if (event.key === "ArrowLeft" && pos > 0) {
          state.currentAyah = visible[pos - 1];
          renderReader();
        }
        if (event.key === "ArrowRight" && pos < visible.length - 1) {
          state.currentAyah = visible[pos + 1];
          renderReader();
        }
      });
    }

    function setSurah(n) {
      state.currentSurah = n;
      state.currentAyah = 0;
      renderSurahControls();
      renderReader();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function init() {
      try {
        await loadCorpus();
        renderStats();
        renderSurahControls();
        bindEvents();
        renderReader();
      } catch (error) {
        $("reader").innerHTML = `<div class="error">${escapeHtml(error.message)}. GitHub Pages must serve underscore directories; this repo includes .nojekyll for that.</div>`;
      }
    }

    init();
  </script>
</body>
</html>
